<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05070d">
<meta name="description" content="Smash Việt – game cầu lông 3D chơi trên trình duyệt, đấu online với bạn bè trên điện thoại và máy tính."><link rel="icon" href="icon.png"><title>Smash Việt – Cầu lông 3D</title>
<style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:#05070d;color:#eef2ff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;overflow:hidden;touch-action:none}
canvas#gl{position:fixed;inset:0;width:100vw;height:100vh;display:block}
#ui{position:fixed;inset:0;z-index:20;pointer-events:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#ui .scr{pointer-events:auto;position:absolute;inset:0;padding:calc(env(safe-area-inset-top) + 10px) calc(env(safe-area-inset-right) + 12px) calc(env(safe-area-inset-bottom) + 10px) calc(env(safe-area-inset-left) + 12px);overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.scr.dim{background:linear-gradient(180deg,rgba(5,8,18,.82),rgba(5,8,18,.94))}
.scr.side{background:linear-gradient(90deg,rgba(5,8,18,.92) 0%,rgba(5,8,18,.82) 55%,rgba(5,8,18,.15) 100%)}
.portrait .scr.side{background:linear-gradient(180deg,rgba(5,8,18,.2) 0%,rgba(5,8,18,.85) 40%,rgba(5,8,18,.95) 100%)}
h1{margin:4px 0 2px;font-size:30px;letter-spacing:1px;font-weight:900}
h1 b{color:#ffd23f}
h2{margin:6px 0 8px;font-size:20px}
h3{margin:10px 0 6px;font-size:15px;color:#9fb3ff;text-transform:uppercase;letter-spacing:.5px}
.sub{color:#9aa6c4;font-size:13px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.top .sp{flex:1}
.coin{background:#2b2408;border:1px solid #6b5a12;color:#ffd23f;border-radius:999px;padding:5px 12px;font-weight:800;font-size:14px;white-space:nowrap}
.coin:before{content:"● ";color:#ffc400}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:10px 16px;border-radius:14px;border:1px solid #2c3a66;background:#141d3a;color:#eef2ff;font-weight:700;font-size:15px;cursor:pointer}
.btn:active{transform:scale(.97);filter:brightness(1.2)}
.btn.pri{background:linear-gradient(180deg,#ffd84a,#f2b20c);color:#1d1600;border-color:#ffe27a}
.btn.red{background:#5b1420;border-color:#a52a3d}
.btn.sm{min-height:36px;padding:6px 12px;font-size:13px;border-radius:10px}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.45}
.menu{display:grid;gap:10px;max-width:420px}
.menu .btn{justify-content:flex-start;font-size:17px;min-height:54px}
.menu .btn i{font-style:normal;width:28px;text-align:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.card{background:rgba(20,29,58,.9);border:1px solid #26345f;border-radius:16px;padding:12px;position:relative}
.card.sel{border-color:#ffd23f;box-shadow:0 0 0 2px rgba(255,210,63,.35)}
.card.lock{opacity:.5}
.card .t{font-weight:800;font-size:16px}
.card .b{color:#9fb3ff;font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
.card .d{color:#aab4cf;font-size:12.5px;margin:4px 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.chip{padding:7px 12px;border-radius:999px;border:1px solid #2c3a66;background:#111a35;font-size:13px;font-weight:700}
.chip.on{background:#ffd23f;color:#1a1400;border-color:#ffd23f}
.bar{height:7px;background:#0b1129;border-radius:9px;overflow:hidden;flex:1}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#3bb2ff,#7cf0c5);border-radius:9px}
.stat{display:flex;align-items:center;gap:8px;font-size:12px;margin:3px 0}
.stat span{width:70px;color:#aab4cf}
.stat em{width:26px;text-align:right;font-style:normal;font-weight:800}
.tag{display:inline-block;padding:2px 8px;border-radius:8px;font-size:11px;font-weight:800;background:#22305c;color:#cfe0ff}
.tag.gold{background:#5c4a08;color:#ffd23f}.tag.green{background:#0f4d2e;color:#7cf0c5}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid transparent;display:inline-block}
.sw.on{border-color:#fff}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:7px 6px;border-bottom:1px solid #1d2850;text-align:left}
th{color:#9fb3ff;font-size:12px}
tr.me td{background:rgba(255,210,63,.12);font-weight:800}
.cc{display:inline-block;min-width:34px;padding:1px 4px;border-radius:5px;background:#26345f;font-size:11px;font-weight:800;text-align:center}
input[type=text]{width:100%;max-width:340px;padding:12px;border-radius:12px;border:1px solid #2c3a66;background:#0b1129;color:#fff;font-size:16px;user-select:text;-webkit-user-select:text}
input[type=range]{width:100%;max-width:360px}
.modal{position:absolute;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;pointer-events:auto;z-index:50}
.modal .box{background:#121a36;border:1px solid #2c3a66;border-radius:18px;padding:16px;width:min(92vw,420px)}
.toast{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 18px);transform:translateX(-50%);background:#0d1430;border:1px solid #2c3a66;padding:10px 16px;border-radius:12px;font-weight:700;z-index:60;pointer-events:none;max-width:90vw;text-align:center}
/* ---------- trong trận ---------- */
#hud{position:fixed;inset:0;z-index:10;pointer-events:none;display:none}
#hud.on{display:block}
.sb{position:absolute;left:calc(env(safe-area-inset-left) + 8px);top:calc(env(safe-area-inset-top) + 8px);background:rgba(8,12,26,.82);border-radius:10px;overflow:hidden;font-size:13px;min-width:200px;border:1px solid rgba(255,255,255,.08)}
.sb .r{display:flex;align-items:center;gap:6px;padding:4px 8px}
.sb .r+.r{border-top:1px solid rgba(255,255,255,.08)}
.sb .k{width:6px;height:16px;border-radius:2px}
.sb .n{flex:1;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
.sb .g{width:18px;text-align:center;color:#9aa6c4;font-weight:800}
.sb .s{width:28px;text-align:center;background:#fff;color:#111;border-radius:4px;font-weight:900}
.sb .sv{width:8px;height:8px;border-radius:50%;background:transparent}
.sb .sv.on{background:#ffd23f;box-shadow:0 0 6px #ffd23f}
.sb .ttl{font-size:11px;color:#9aa6c4;padding:3px 8px;background:rgba(255,255,255,.04)}
.pop{position:absolute;left:50%;top:calc(env(safe-area-inset-top) + 14%);transform:translateX(-50%);font-size:clamp(18px,4.2vmin,30px);font-weight:900;text-shadow:0 2px 0 #000,0 0 3px #000;white-space:nowrap;opacity:0;transition:opacity .2s;will-change:opacity}
.pop small{display:block;text-align:center;font-size:.6em;color:#ffd23f}
.ban{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);text-align:center;background:rgba(8,12,26,.85);padding:12px 22px;border-radius:16px;border:1px solid rgba(255,255,255,.12);opacity:0;transition:opacity .25s;max-width:90vw;will-change:opacity}
.ban b{display:block;font-size:clamp(20px,5vmin,34px)}
.ban span{color:#cfd8f5;font-size:14px}
.hint{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 132px);transform:translateX(-50%);background:rgba(8,12,26,.7);padding:6px 12px;border-radius:10px;font-size:12.5px;color:#dfe6ff;white-space:nowrap;opacity:0;transition:opacity .2s;will-change:opacity}
.pz{position:absolute;right:calc(env(safe-area-inset-right) + 10px);top:calc(env(safe-area-inset-top) + 8px);pointer-events:auto;width:46px;height:46px;border-radius:12px;background:rgba(8,12,26,.75);border:1px solid rgba(255,255,255,.15);color:#fff;font-size:20px;font-weight:900}
.pad{position:absolute;inset:0;pointer-events:auto;touch-action:none}
.joy{position:absolute;width:132px;height:132px;margin:-66px 0 0 -66px;border-radius:50%;border:2px solid rgba(255,255,255,.28);background:rgba(255,255,255,.06);display:none}
.joy i{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:rgba(255,255,255,.35)}
.joyhint{position:absolute;left:calc(env(safe-area-inset-left) + 34px);bottom:calc(env(safe-area-inset-bottom) + 34px);width:110px;height:110px;border-radius:50%;border:2px dashed rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:11px;color:rgba(255,255,255,.45);text-align:center}
.acts{position:absolute;right:calc(env(safe-area-inset-right) + 14px);bottom:calc(env(safe-area-inset-bottom) + 16px);width:230px;height:200px;pointer-events:none}
.act{position:absolute;width:82px;height:82px;border-radius:50%;pointer-events:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;font-size:16px;color:#fff;border:3px solid rgba(255,255,255,.55);text-shadow:0 1px 3px #000;touch-action:none}
.act small{font-size:9.5px;font-weight:700;opacity:.9}
.act.down{transform:scale(.92);filter:brightness(1.3)}
.act.high{background:rgba(30,110,230,.72);right:150px;bottom:6px}
.act.attack{background:rgba(220,40,55,.78);right:0;bottom:78px;width:92px;height:92px}
.act.soft{background:rgba(20,150,90,.75);right:52px;bottom:0}
.portrait .acts{transform:scale(.92);transform-origin:right bottom}
.portrait .sb{min-width:170px;font-size:12px}

.aimtip{position:absolute;right:calc(env(safe-area-inset-right) + 14px);bottom:calc(env(safe-area-inset-bottom) + 220px);font-size:11px;color:rgba(255,255,255,.55);text-align:right;pointer-events:none}
.act .arw{position:absolute;left:50%;top:50%;width:0;height:0;pointer-events:none}
.act .arw i{position:absolute;left:-3px;top:-3px;width:6px;height:46px;border-radius:3px;background:#fff;transform-origin:3px 3px;opacity:.85}
.netq{position:absolute;right:calc(env(safe-area-inset-right) + 64px);top:calc(env(safe-area-inset-top) + 14px);font-size:12px;font-weight:800;padding:3px 8px;border-radius:8px;background:rgba(8,12,26,.75);color:#9aa6c4}
.netq.ok{color:#4cd39a}.netq.mid{color:#ffd23f}.netq.bad{color:#ff5a6a}
/* máy tính: ẩn điều khiển cảm ứng, hiện bảng phím */
body.keys #hud .pad,body.keys #hud .joy,body.keys #hud .joyhint,body.keys #hud .aimtip,body.keys #hud .acts{display:none!important}
.keyhelp{display:none}
body.keys .keyhelp{display:flex;position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 10px);gap:14px;align-items:center;flex-wrap:wrap;justify-content:center;max-width:94vw;background:rgba(8,12,26,.72);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:7px 14px;font-size:12px;color:#cfd6ea;pointer-events:none}
.keyhelp kbd{display:inline-block;min-width:20px;padding:2px 5px;margin:0 1px;border-radius:5px;background:#1d2440;border:1px solid #3a4470;border-bottom-width:3px;font:800 11px/1.3 inherit;text-align:center;color:#fff;transition:transform .05s}
.keyhelp kbd.on{background:#ffd23f;color:#111;border-color:#c9a316;transform:translateY(2px)}
.keyhelp .kh{font-weight:900}.keyhelp .kh.high{color:#5aa2ff}.keyhelp .kh.attack{color:#ff5a6a}.keyhelp .kh.soft{color:#4cd39a}
.keyhelp .d{color:#8f9ab8;font-size:11px}
body.keys #gl{cursor:crosshair}
body.keys .keyhelp .kh{font-size:12px;white-space:nowrap}
</style></head>
